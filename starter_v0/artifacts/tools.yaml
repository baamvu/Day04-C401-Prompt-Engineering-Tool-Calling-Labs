# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user a question and wait for their response. Use when: (1) required info is missing (no account name, no URL), (2) before any send/publish action to confirm. Use response_type='yes_no' for confirmation, response_type='text' for open questions."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Get recent posts from a specific Twitter/X account. Requires the account's screen name (handle). If user doesn't specify whose tweets, call clarify first."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Search Twitter/X posts by keyword. Use the user's exact keywords for query. Use search_type='Top' for popular posts, 'Latest' for recent posts."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Search the web for information. Use topic='news' for current events. Use the user's exact keywords for query - do NOT expand or translate."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Read and extract content from a specific URL. Only use when the user provides an exact URL. If no URL is given, call clarify to ask for it."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Send text to a channel. ONLY call this tool AFTER the user has explicitly confirmed. NEVER call directly without confirmation."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- New tool ----------------
  - name: summarize
    description: "Summarize provided text by extracting key sentences. Use when the user pastes or provides text directly and asks to summarize. Do NOT use for URLs (use fetch) or for topics (use lookup)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The text to summarize"}
        max_sentences: {type: integer, default: 3, description: "Maximum number of sentences to extract"}
      required: [text]

  - name: calculator
    description: "Evaluate math expressions safely. Supports +, -, *, /, **, sqrt, sin, cos, tan, log, abs, round. Use when the user asks to calculate or solve a math expression."
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Math expression to evaluate, e.g. '2**10', 'sqrt(144)', '3.14 * 2'"}
      required: [expression]

  - name: text_stats
    description: "Analyze text and return statistics: word count, character count, sentence count, paragraph count, and estimated reading time. Use when the user asks 'bao nhiêu từ', 'thống kê văn bản', 'reading time', etc."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The text to analyze"}
      required: [text]

  - name: datetime_info
    description: "Get current date, time, day of week. Use when the user asks 'hôm nay là ngày mấy', 'mấy giờ rồi', 'ngày tháng năm', or needs current date/time context."
    parameters:
      type: object
      properties:
        timezone_offset: {type: integer, default: 7, description: "UTC offset in hours (default 7 for Vietnam)"}

  - name: json_format
    description: "Parse, validate, and format JSON strings. Returns formatted JSON, validity status, top-level keys. Use when the user provides JSON and asks to format, validate, or check it."
    parameters:
      type: object
      properties:
        json_string: {type: string, default: "", description: "The JSON string to parse and format"}
        indent: {type: integer, default: 2, description: "Indentation spaces for formatting"}
      required: [json_string]
